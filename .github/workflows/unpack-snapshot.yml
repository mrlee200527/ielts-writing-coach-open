name: Unpack reviewed MVP snapshot

on:
  push:
    paths:
      - .github/workflows/unpack-snapshot.yml

permissions:
  contents: write

jobs:
  unpack:
    if: github.repository == 'mrlee200527/ielts-writing-coach-open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify archive and publish files
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'dddc074303b3c03f38e7d1f2fe91e150c0547d4bf021f35e724a30354996bcd7' 'public-mvp-snapshot.zip' | sha256sum --check
          unzip -Z1 public-mvp-snapshot.zip > /tmp/mvp-files.txt
          if grep -E '(^/|(^|/)\.\.(/|$)|(^|/)(\.env\.local|\.data|node_modules|题库)(/|$)|\.pdf$|\.docx$)' /tmp/mvp-files.txt; then
            echo 'Archive contains an excluded path.' >&2
            exit 1
          fi
          unzip -q public-mvp-snapshot.zip
          test -f README.md
          test -f LICENSE
          test -f '原型图/Version_1_总架构.png'
          rm public-mvp-snapshot.zip
          stamp="$(TZ=Asia/Shanghai date +'%Y-%m-%dT%H:%M:%S+08:00')"
          cat >> CHANGELOG.md <<EOF

          ## ${stamp} | GitHub Actions | 发布验证阶段

          - 分工 AI：无
          - 任务：发布 Stable MVP 开源副本。
          - 动作：验证快照哈希与排除清单，解包源码，并移除临时压缩包。
          - 结果：源码、README、MIT License 和原型图已提交至公开仓库。
          - 状态：已完成
          - 下一步：由单一执行 AI 在 GitHub 页面核对发布结果。
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: publish reviewed stable MVP files'
          git push
